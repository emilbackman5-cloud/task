<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logga in – Vår grupp</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <img src="img/logo.svg" alt="Blå cirkulär logotyp med en gul triangel och en vit cirkel i mitten" class="logo">
    <nav>
      <a href="index.html">Hem</a>
      <a href="person1.html">Medlem 1</a>
      <a href="person2.html">Medlem 2</a>
      <a href="login.html">Logga in</a>
    </nav>
  </header>
  <main class="content">
    <h1>Logga in</h1>
    <img src="img/photo.png" alt="Dekorativ bild (PNG)" class="portrait">
    <form id="loginForm" class="login" novalidate>
      <label for="username">Användarnamn</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <label for="password">Lösenord</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Kontrollera lösenord</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <footer class="site-footer">
    <p>Kurs 1ik163, Linnéuniversitetet · <a href="https://lnu.se" target="_blank" rel="noopener">lnu.se</a></p>
  </footer>
  <script src="js/login.js"></script>
</body>
</html>
